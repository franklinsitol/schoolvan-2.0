<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <!-- Yellow Van Gradient -->
    <linearGradient id="vanYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Window Glass Gradient -->
    <linearGradient id="windowBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Background: Dark Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FACC15" stroke-width="6" stroke-opacity="0.3" />

  <!-- Cute Sparkle in Top-Right Corner (T.IA) -->
  <g transform="translate(416, 96)">
    <circle cx="0" cy="0" r="32" fill="#FACC15" opacity="0.15" />
    <path d="M0 -22 L4.5 -6 L20 -1.5 L4.5 3 L0 18.5 L-4.5 3 L-20 -1.5 L-4.5 -6 Z" fill="#FACC15" />
  </g>

  <!-- Scaled Van Group Centered (Original 64x64 mapped to ~380x380) -->
  <!-- Scale factor = 7.0, Offset: X = 32, Y = 36 -->
  <g transform="translate(32, 36) scale(7.0)" filter="url(#softShadow)">
    
    <!-- Van Ground Shadow -->
    <ellipse cx="32" cy="54" rx="24" ry="3.5" fill="#000000" fill-opacity="0.5" />

    <!-- Main Van Yellow Body -->
    <path 
      d="M8 22C8 18.6863 10.6863 16 14 16H42C45.3137 16 48.2415 17.8923 49.5695 20.9328L54.6766 32.6308C55.5262 34.5779 56 36.6806 56 38.8078V48C56 49.6569 54.6569 51 53 51H51C51 46.5817 47.4183 43 43 43C38.5817 43 35 46.5817 35 51H29C29 46.5817 25.4183 43 21 43C16.5817 43 13 46.5817 13 51H11C9.34315 51 8 49.6569 8 48V22Z" 
      fill="url(#vanYellow)" 
    />

    <!-- Front Nose & Bumper Curve Accent -->
    <path 
      d="M50 34L54.6766 32.6308C55.5262 34.5779 56 36.6806 56 38.8078V48H52V38C52 36 51 34.5 50 34Z" 
      fill="#CA8A04" 
    />

    <!-- Windshield & Windows Frame (Dark Slate Tint) -->
    <path 
      d="M40 20H13V31H42.5L40 20Z" 
      fill="#0F172A" 
    />
    
    <!-- Window Glass Reflections (Glossy Cyan/Sky Blue) -->
    <path d="M16 22H24V29H16V22Z" fill="url(#windowBlue)" />
    <path d="M26 22H34V29H26V22Z" fill="url(#windowBlue)" />
    <path d="M36 22L38.2 29H36V22Z" fill="url(#windowBlue)" />

    <!-- Cute Window Gloss Highlights -->
    <polygon points="17,23 20,23 18,28 16,28" fill="#FFFFFF" fill-opacity="0.45" />
    <polygon points="27,23 30,23 28,28 26,28" fill="#FFFFFF" fill-opacity="0.45" />

    <!-- Iconic Black Side Stripe (ESCOLAR) -->
    <rect x="8" y="34" width="48" height="6" fill="#1E293B" />
    
    <!-- ESCOLAR Text on Stripe -->
    <text 
      x="30" 
      y="38.5" 
      fill="#FACC15" 
      font-size="3.8" 
      font-weight="900" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      letter-spacing="0.8" 
      text-anchor="middle"
    >
      ESCOLAR
    </text>

    <!-- Front Headlight (Bright Glowing Yellow / White) -->
    <rect x="52" y="42" width="4" height="4" rx="1.5" fill="#FEF08A" />
    <circle cx="54" cy="44" r="1.2" fill="#FFFFFF" />

    <!-- Back Taillight (Red) -->
    <rect x="8" y="42" width="2" height="4" rx="1" fill="#EF4444" />

    <!-- Front & Rear Bumpers -->
    <rect x="53" y="47" width="4" height="3" rx="1" fill="#475569" />
    <rect x="7" y="47" width="3" height="3" rx="1" fill="#475569" />

    <!-- Cute Big Wheels (Outer Rubber Tire) -->
    <circle cx="21" cy="50" r="5.2" fill="#0F172A" />
    <circle cx="43" cy="50" r="5.2" fill="#0F172A" />

    <!-- Wheels (Inner Steel Hubcaps) -->
    <circle cx="21" cy="50" r="2.8" fill="#94A3B8" />
    <circle cx="43" cy="50" r="2.8" fill="#94A3B8" />
    <circle cx="21" cy="50" r="1.2" fill="#F8FAFC" />
    <circle cx="43" cy="50" r="1.2" fill="#F8FAFC" />

    <!-- Side Mirror -->
    <rect x="42" y="27" width="2.5" height="4" rx="1" fill="#1E293B" />
  </g>
</svg>
